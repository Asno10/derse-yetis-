/* Layout: one calm screen. A slim dark band under the iOS status bar, then a single answer:
   the time to leave, the bus to catch, when you arrive, and one button. Everything else sits
   behind "Ayrıntılar" or the gear. */
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#111820; --muted:#5F6A77; --line:#DADFE5;
  --accent:#0F6A8A; --accent-ink:#FFFFFF; --accent-soft:#DCEDF3;
  --ok:#1B8455; --ok-soft:#DDF1E6; --warn:#AE5E15; --warn-soft:#F8E8D5; --bad:#C23434; --bad-soft:#F8DEDE;
  --board:#14120D; --board-ink:#F3EEE2; --board-muted:#A79F8C;
  --sign:#0E0C08; --led:#FFB01F;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Overpass","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-led:"DotGothic16",ui-monospace,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --surface:#151C23; --surface-2:#1A222A; --ink:#E6EBF0; --muted:#94A1AF; --line:#26303A;
    --accent:#4DB1D2; --accent-ink:#062530; --accent-soft:#11303B;
    --ok:#4CC387; --ok-soft:#113425; --warn:#E59D55; --warn-soft:#3A2815; --bad:#F06C6C; --bad-soft:#3D1C1C;
    --board:#0A0906; --board-ink:#F3EEE2; --board-muted:#A79F8C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222A; --ink:#E6EBF0; --muted:#94A1AF; --line:#26303A;
  --accent:#4DB1D2; --accent-ink:#062530; --accent-soft:#11303B;
  --ok:#4CC387; --ok-soft:#113425; --warn:#E59D55; --warn-soft:#3A2815; --bad:#F06C6C; --bad-soft:#3D1C1C;
  --board:#0A0906; --board-ink:#F3EEE2; --board-muted:#A79F8C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:440px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Top band */
.band{background:var(--board);color:var(--board-ink);padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:12px}
.band .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.band p{margin:0;font-size:15px;color:var(--board-muted)}
.band b{color:var(--board-ink);font-weight:600}
.iconbtn{border:0;background:transparent;color:var(--board-ink);width:44px;height:44px;margin-right:-10px;display:grid;place-items:center;border-radius:12px}
.iconbtn svg{width:24px;height:24px}

main.wrap{padding-block:22px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}

/* Home */
.target{align-self:flex-start;border:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.target span{color:var(--muted);font-weight:500}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.label{margin:0;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.time{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(96px,32vw,132px);line-height:.85;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.count{margin:6px 0 0;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-weight:700;font-size:16px}
.count.calm{background:var(--ok-soft);color:var(--ok)}
.count.soon{background:var(--warn-soft);color:var(--warn)}
.count.now{background:var(--bad);color:#fff}
.count.future{background:var(--accent-soft);color:var(--accent)}

.facts{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fact{display:flex;align-items:center;gap:14px;padding:14px 16px}
.fact+.fact{border-top:1px solid var(--line)}
.fact .k{flex:1;min-width:0}
.fact .k b{display:block;font-size:17px;font-weight:600;line-height:1.25}
.fact .k span{display:block;font-size:14px;color:var(--muted);line-height:1.3}
.fact .v{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}
.led{flex-shrink:0;background:var(--sign);color:var(--led);font-family:var(--f-led);font-size:20px;line-height:1;padding:8px 9px 6px;border-radius:8px;text-shadow:0 0 6px rgba(255,176,31,.55)}
.pin{flex-shrink:0;width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.pin svg{width:20px;height:20px}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.live.off i{background:var(--muted)}

.primary{width:100%;min-height:60px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px}
.secondary{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600;font-size:16px}
.quiet{align-self:center;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:15px;padding:8px 12px;border-radius:10px}
.note{margin:0;font-size:14px;color:var(--muted);text-align:center}

/* Details */
.details{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.details h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:baseline}
.steps time{font-family:var(--f-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.steps span{font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.chip b{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip span{font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .ok{color:var(--ok)} .chip .warn{color:var(--warn)} .chip .bad{color:var(--bad)}
.details p{margin:0;font-size:15px}
a.link{color:var(--accent);font-weight:600;text-decoration:none}

/* Picker and settings */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:0;background:transparent;text-align:left;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row b{font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.row span{color:var(--muted);font-size:15px}
.row[aria-pressed="true"]{background:var(--accent-soft)}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1}
.section{display:flex;flex-direction:column;gap:12px}
.section h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
input[type=text],input[type=time],input[type=number],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;font-size:16px}
textarea{min-height:72px;resize:vertical;font-size:13px;font-family:ui-monospace,monospace}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:13px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.addrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.lec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.lec+.lec{border-top:1px solid var(--line)}
.lec span{font-weight:600}
.lec b{font-family:var(--f-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;margin-left:8px}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:6px 10px;border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:10px 6px;border:0;background:var(--surface-2);font-weight:600;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.back{align-self:flex-start;border:0;background:transparent;color:var(--accent);font-weight:700;font-size:16px;padding:6px 0}
.small{font-size:14px}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;width:max-content;max-width:min(400px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    </button>
  </div>
</header>
<main class="wrap" id="view"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>

/* MODEL START */

const T = s => { const p = s.split(':'); let v = (+p[0]) * 60 + (+p[1]); if (v < 180) v += 1440; return v; };
const parseList = s => s.trim().split(/\s+/).map(T);
const TT = {
  wd: parseList('05:55 06:20 06:40 06:54 07:08 07:22 07:36 07:50 08:04 08:18 08:32 08:46 09:00 09:16 09:32 09:48 10:04 10:20 10:36 10:52 11:08 11:24 11:40 11:56 12:12 12:28 12:44 13:00 13:16 13:30 13:44 13:58 14:12 14:26 14:40 14:54 15:08 15:22 15:36 15:50 16:04 16:18 16:32 16:46 17:00 17:14 17:27 17:41 17:51 18:01 18:12 18:26 18:40 18:52 19:08 19:22 19:36 19:50 20:05 20:18 20:45 21:15 21:45 22:15 22:45 23:15 23:40 00:15'),

  sun: parseList('06:00 06:30 07:00 07:30 08:00 08:30 09:00 09:25 09:47 10:10 10:27 10:44 11:01 11:18 11:32 11:46 12:02 12:15 12:29 12:44 12:58 13:12 13:27 13:41 13:55 14:10 14:24 14:38 14:53 15:07 15:21 15:36 15:50 16:04 16:19 16:33 16:47 17:02 17:16 17:30 17:45 17:59 18:13 18:28 18:42 18:56 19:11 19:25 19:45 20:15 20:45 21:15 21:45 22:15 22:45 23:15 23:45 00:15')
};

const ROUTE_LEN = 13321;
const STOPS = [
  {id:31370, n:'Evka 4 Son Durak', d:0,    la:38.49504, lo:27.21397},
  {id:31368, n:'Evka-4 Anaokulu',  d:207,  la:38.49360, lo:27.21280},
  {id:31366, n:'Mehmet Akif Cami', d:431,  la:38.49190, lo:27.21370},
  {id:31364, n:'Evka 4 Muhtarlık', d:672,  la:38.49030, lo:27.21490},
  {id:31362, n:'Yeditepe İtfaiye', d:906,  la:38.48832, lo:27.21429},
  {id:31360, n:'Depo',             d:1154, la:38.48784, lo:27.21643},
  {id:31358, n:'Nedim Dağtaş',     d:1513, la:38.48517, lo:27.21793},
  {id:31392, n:'Turgut Reis',      d:1934, la:38.48306, lo:27.21577},
  {id:31390, n:'Gazi',             d:2215, la:38.48286, lo:27.21257},
  {id:31388, n:'Akdemir Parkı',    d:2613, la:38.48437, lo:27.20853},
  {id:31386, n:'Sevgi',            d:2927, la:38.48400, lo:27.20490},
  {id:32423, n:'Seyit Şanlı Anadolu Lisesi', d:3184, la:38.48185, lo:27.20410}

const FULL_RIDE = {early:34, am:38, mid:36, pm:40, night:30};
const DAYF = {wd:1, sat:0.93, sun:0.88};
const BANDS = ['early','am','mid','pm','night'];
const N_SIM = 1600;
const CONF = 0.9;

function band(m){ if (m < 420) return 'early'; if (m < 600) return 'am'; if (m < 960) return 'mid'; if (m < 1200) return 'pm'; return 'night'; }
function dayTypeOf(date){ const d = date.getDay(); return d === 0 ? 'sun' : d === 6 ? 'sat' : 'wd'; }
function stopById(id){ return STOPS.find(s => s.id === id) || STOPS[0]; }
function stopIndex(id){ const i = STOPS.findIndex(s => s.id === id); return i < 0 ? 0 : i; }
function frac(id){ return (ROUTE_LEN - stopById(id).d) / ROUTE_LEN; }
function passMed(dep, stopId, dt){ return dep + FULL_RIDE[band(dep)] * DAYF[dt] * stopById(stopId).d / ROUTE_LEN; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function nrm(r){ let u = 0; while (u === 0) u = r(); const v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function expo(r, m){ return -Math.log(1 - r()) * m; }
function pick(a, r){ return a[Math.floor(r() * a.length)]; }
function wt(n, k){ return n / (n + k); }
function median(a){ if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function mean(a){ return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
function quant(sorted, q){ if (!sorted.length) return NaN; const i = Math.min(sorted.length - 1, Math.max(0, Math.round(q * (sorted.length - 1)))); return sorted[i]; }
function headwayAt(dt, m){ for (const [a, b, h] of METRO[dt]) if (m >= a && m < b) return h; return null; }
function metroWait(dt, m, r){ if (m < 360) return (360 - m) + r() * 7.5; if (m >= 1460) return 600; return r() * (headwayAt(dt, m) || 10); }
// Expected minutes from boarding the bus to reaching the department (timetable model, no personal data).
function priorPost(set, b, dt, stopId, boardMin){
  const ride = FULL_RIDE[b] * DAYF[dt] * frac(stopId);
  const h = headwayAt(dt, boardMin + ride + set.transfer) || 10;
  return ride + set.transfer + h / 2 + 2.5 + set.walkFromMetro;
}
// Learned from her own trips: bus deviation at her stop, and how long boarding-to-department really takes (as a ratio to the model).
function buildModel(state){
  const obs = {delay: [], post: {early: [], am: [], mid: [], pm: [], night: []}};
  for (const t of state.trips){
    const x = t.t || {};
    if (t.delay != null && t.delay > -6 && t.delay < 30) obs.delay.push(t.delay);
    if (x.board && x.arrive && t.dep != null){
      const b = band(t.dep), boardMin = (x.board - t.base) / 60000, post = (x.arrive - x.board) / 60000;
      const ratio = post / priorPost(state.set, b, t.dt || 'wd', t.stopId, boardMin);
      if (ratio > 0.4 && ratio < 2.5) obs.post[b].push(ratio);
    }
  }
  const pooled = []; for (const b of BANDS) pooled.push(...obs.post[b]);
  return {set: state.set, obs, pooled, n: state.trips.length};
}
function ratioMed(M, b){
  const o = M.obs.post[b];
  if (o.length){ const w = wt(o.length, 4); return w * median(o) + (1 - w); }
  if (M.pooled.length){ const w = wt(M.pooled.length, 8); return w * median(M.pooled) + (1 - w); }
  return 1;
}
function sampleDelay(M, r){ const o = M.obs.delay; if (o.length && r() < wt(o.length, 4)) return pick(o, r) + nrm(r) * 0.3; let d = 0.5 + nrm(r) * 0.9; if (r() < 0.1) d += expo(r, 4); return Math.max(-1.5, d); }
function samplePost(M, b, dt, stopId, boardMin, r){
  const o = M.obs.post[b];
  if (o.length && r() < wt(o.length, 4)) return pick(o, r) * priorPost(M.set, b, dt, stopId, boardMin) * Math.exp(nrm(r) * 0.04);
  if (!o.length && M.pooled.length && r() < wt(M.pooled.length, 8)) return pick(M.pooled, r) * priorPost(M.set, b, dt, stopId, boardMin) * Math.exp(nrm(r) * 0.05);
  let ride = FULL_RIDE[b] * DAYF[dt] * Math.exp(nrm(r) * 0.11); if (r() < 0.05) ride += expo(r, 5);
  ride *= frac(stopId);
  const off = boardMin + ride, tr = Math.max(1.5, M.set.transfer + nrm(r) * 0.8);
  return ride + tr + metroWait(dt, off + tr, r) + 2.5 + nrm(r) * 0.25 + Math.max(3, M.set.walkFromMetro + nrm(r));
}
function seedOf(){ let h = 2166136261; for (const a of arguments){ const s = String(a); for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } } return h >>> 0; }
// Leave at `leave`, aim for bus k0; if she misses it she takes the next one.
function simLeave(M, dt, stopId, leave, k0, seed){
  const deps = TT[dt], r = mulberry32(seed), out = new Float64Array(N_SIM);
  for (let i = 0; i < N_SIM; i++){
    const tStop = leave + Math.max(0.5, M.set.walkToStop + nrm(r) * 0.4);
    let j = k0, board = -1;
    while (j < deps.length && j < k0 + 5){ const a = passMed(deps[j], stopId, dt) + sampleDelay(M, r); if (a >= tStop){ board = a; break; } j++; }
    out[i] = board < 0 ? Infinity : board + samplePost(M, band(deps[j]), dt, stopId, board, r);
  }
  out.sort(); return out;
}
function simBoard(M, dt, stopId, dep, boardMin, seed){
  const r = mulberry32(seed), out = new Float64Array(N_SIM), b = band(dep);
  for (let i = 0; i < N_SIM; i++) out[i] = boardMin + samplePost(M, b, dt, stopId, boardMin, r);
  out.sort(); return out;
}
function summarize(arr, deadline){ let c = 0; for (const v of arr) if (v <= deadline) c++; return {p: c / arr.length, q10: quant(arr, .1), q50: quant(arr, .5), q90: quant(arr, .9)}; }
function pickRec(opts){
  let rec = -1;
  for (let i = opts.length - 1; i >= 0; i--) if (opts[i].p >= CONF){ rec = i; break; }
  if (rec < 0 && opts.length){ rec = 0; for (let i = 1; i < opts.length; i++) if (opts[i].p > opts[rec].p + 0.005) rec = i; }
  return rec;
}
function planFor(state, dt, L, nowMin){
  const deps = TT[dt], M = buildModel(state), stopId = state.set.stopId, wm = state.set.walkToStop;
  const margin = 1.5, deadline = L - state.set.buffer, opts = [];
  const mk = k => {
    const pass = passMed(deps[k], stopId, dt), leave = Math.floor(pass - margin - wm);
    return Object.assign({k, dep: deps[k], pass, leave}, summarize(simLeave(M, dt, stopId, leave, k, seedOf(dt, k, stopId, M.n, L, wm, state.set.walkFromMetro, state.set.buffer)), deadline));
  };
  for (let k = 0; k < deps.length; k++){
    const pass = passMed(deps[k], stopId, dt);
    if (pass > L - 15 || pass < L - 150) continue;
    if (nowMin != null && Math.floor(pass - margin - wm) < nowMin - 2) continue;
    opts.push(mk(k));
  }
  let late = false;
  if (!opts.length && nowMin != null){
    for (let k = 0; k < deps.length && opts.length < 2; k++){
      const pass = passMed(deps[k], stopId, dt);
      if (Math.floor(pass - margin - wm) >= nowMin - 2 && pass < L + 120) opts.push(mk(k));
    }
    late = opts.length > 0;
  }
  return {dt, opts, rec: pickRec(opts), deadline, L, M, wm, margin, late};
}
function inferBus(dt, stopId, boardMin){
  let best = null, bd = 1e9;
  for (const d of TT[dt]){ const diff = boardMin - passMed(d, stopId, dt); if (diff < -4 || diff > 25) continue; const sc = Math.abs(diff - 0.7); if (sc < bd){ bd = sc; best = d; } }
  return best == null ? null : {dep: best, delay: boardMin - passMed(best, stopId, dt)};
}
function haversine(la1, lo1, la2, lo2){ const R = 6371000, r = Math.PI / 180, a = Math.sin((la2 - la1) * r / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin((lo2 - lo1) * r / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(a)); }
// Interpret the open-data "approaching buses" list for her stop.
function parseLive(list, stopId, dt, nowMin){
  const si = stopIndex(stopId), me = stopById(stopId), term = STOPS[0], out = [];
  const speed = ROUTE_LEN / (FULL_RIDE[band(nowMin)] * DAYF[dt]);
  for (const b of list || []){
    if (b == null) continue;
    if (b.HatNumarasi != null && +b.HatNumarasi !== 568) continue;
    const K = +b.KalanDurakSayisi;
    const la = parseFloat(String(b.KoorX).replace(',', '.')), lo = parseFloat(String(b.KoorY).replace(',', '.'));
    if (!isFinite(K) || K < 0) continue;
    if (isFinite(la) && isFinite(lo) && haversine(la, lo, me.la, me.lo) > 4500) continue;
    const atTerminal = isFinite(la) && isFinite(lo) && haversine(la, lo, term.la, term.lo) < 180;
    let kind, eta = null;
    if (atTerminal || (si > 0 && K === si) || (si === 0 && K === 0)) kind = 'terminal';
    else if (K > si) kind = 'return';
    else { kind = 'coming'; eta = K === 0 ? 0 : Math.max(0.5, (me.d - STOPS[si - K].d) / speed + K * 0.2); }
    out.push({K, kind, eta});
  }
  out.sort((a, b) => ({coming: 0, terminal: 1, return: 2}[a.kind] - {coming: 0, terminal: 1, return: 2}[b.kind]) || (a.K - b.K));
  return out;
}

/* ---------- Storage: this device only (localStorage, mirrored to IndexedDB) ---------- */
const KEY = 'derse-yetis-v1';
const DEFAULTS = () => ({v:1, onboarded:false, savedAt:0, set:{name:'', lang:'tr', stopId:31370, walkToStop:4, walkFromMetro:12, transfer:3, buffer:5}, lectures:[], trips:[], active:null});
let storageOk = true;
function normalize(s){
  const d = DEFAULTS();
  if (!s || typeof s !== 'object') return d;
  const set = Object.assign(d.set, s.set || {});
  delete set.conf;
  const active = s.active && s.active.t && s.active.t.board ? s.active : null;
  return {v:1, onboarded:!!s.onboarded, savedAt:+s.savedAt || 0, set, lectures:Array.isArray(s.lectures) ? s.lectures : [], trips:Array.isArray(s.trips) ? s.trips : [], active};
}
function loadLocal(){ try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { storageOk = false; return null; } }
const IDB = {
  p: null,
  open(){
    if (this.p) return this.p;
    this.p = new Promise(res => {
      try { const r = indexedDB.open('derse-yetis', 1); r.onupgradeneeded = () => { try { r.result.createObjectStore('kv'); } catch (e) {} }; r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null); }
      catch (e) { res(null); }
    });
    return this.p;
  },
  async get(){ const db = await this.open(); if (!db) return null; return new Promise(res => { try { const q = db.transaction('kv', 'readonly').objectStore('kv').get('state'); q.onsuccess = () => { try { res(q.result ? JSON.parse(q.result) : null); } catch (e) { res(null); } }; q.onerror = () => res(null); } catch (e) { res(null); } }); },
  async set(str){ const db = await this.open(); if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').put(str, 'state'); } catch (e) {} },
  async clear(){ const db = await this.open(); if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').delete('state'); } catch (e) {} }
};
let S = normalize(loadLocal());
let persistAsked = false;
function save(){
  S.savedAt = Date.now();
  const str = JSON.stringify(S);
  try { localStorage.setItem(KEY, str); storageOk = true; } catch (e) { storageOk = false; }
  IDB.set(str);
  if (!persistAsked){ persistAsked = true; try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {} }
}
IDB.get().then(copy => {
  if (!copy){ if (S.savedAt) IDB.set(JSON.stringify(S)); return; }
  const c = normalize(copy);
  if ((c.savedAt || 0) > (S.savedAt || 0)){ S = c; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} render(); }
});

function copyText(txt){ try { navigator.clipboard.writeText(txt).then(() => toast(t('copied')), () => toast(t('copyFail'))); } catch (e) { toast(t('copyFail')); } }
function isTyping(){ const a = document.activeElement; return !!(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)); }

/* ---------- Live bus data ---------- */
const LIVE = {status:'idle', buses:[], at:0, fails:0, pauseUntil:0, busy:false, stopId:null};
async function fetchLive(){
  if (LIVE.busy || Date.now() < LIVE.pauseUntil || !navigator.onLine) return;
  LIVE.busy = true;
  const stopId = S.set.stopId, ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 7000);
  try {
    const res = await fetch('https://openapi.izmir.bel.tr/api/iztek/hattinyaklasanotobusleri/568/' + stopId, {signal: ctl.signal, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer'});
    if (!res.ok && res.status !== 204) throw new Error('http ' + res.status);
    const txt = res.status === 204 ? '' : await res.text();
    const data = txt ? JSON.parse(txt) : [];
    const list = Array.isArray(data) ? data : (data && Array.isArray(data.HatOtobusKonumlari) ? data.HatOtobusKonumlari : []);
    const now = new Date();
    LIVE.buses = parseLive(list, stopId, dayTypeOf(now), minOfDay(now));
    LIVE.at = Date.now(); LIVE.status = 'ok'; LIVE.fails = 0; LIVE.stopId = stopId;
  } catch (e) {
    LIVE.fails++;
    if (!(LIVE.at && Date.now() - LIVE.at < 90000)) LIVE.status = 'down';
    if (LIVE.fails >= 3) LIVE.pauseUntil = Date.now() + 5 * 60000;
  } finally { clearTimeout(to); LIVE.busy = false; }
  if (ui.view === 'home' && !isTyping()) render();
}
function liveFresh(){ return LIVE.status === 'ok' && LIVE.stopId === S.set.stopId && Date.now() - LIVE.at < 150000; }
function liveComing(){ if (!liveFresh()) return null; const el = (Date.now() - LIVE.at) / 60000; const c = LIVE.buses.find(b => b.kind === 'coming'); return c ? Object.assign({}, c, {etaNow: Math.max(0, c.eta - el)}) : null; }
function liveText(){
  if (!liveFresh()) return {txt: t('liveOff'), on: false};
  const c = liveComing();
  if (c) return {txt: c.K === 0 ? t('liveAtStop') : t('liveComing', {k: c.K}), on: true};
  if (LIVE.buses.some(b => b.kind === 'terminal')) return {txt: t('liveWait'), on: true};
  return {txt: t('liveNone'), on: true};
}
function applyLive(P, nowMin){
  const c = liveComing(); if (!c || !P.opts.length) return;
  const livePass = nowMin + c.etaNow;
  let best = -1, bd = 1e9;
  P.opts.forEach((o, i) => { const diff = livePass - o.pass; if (diff >= -6 && diff <= 15 && Math.abs(diff - 1) < bd){ bd = Math.abs(diff - 1); best = i; } });
  if (best < 0) return;
  const o = P.opts[best];
  Object.assign(o, summarize(simBoard(P.M, P.dt, S.set.stopId, o.dep, livePass, seedOf('live', o.dep, Math.round(livePass * 2))), P.deadline), {pass: livePass, leave: Math.floor(livePass - P.margin - P.wm), live: true});
  P.opts = P.opts.filter(x => x.leave >= nowMin - 2);
  P.rec = pickRec(P.opts);
}
let lastPlan = null;
function liveWanted(){
  if (document.hidden || ui.view !== 'home' || S.active) return false;
  if (!lastPlan || !lastPlan.isToday || !lastPlan.o) return false;
  return lastPlan.o.leave - minOfDay(new Date()) < 75;
}

/* ---------- Targets ---------- */
function upcoming(now){
  const out = [], nowMin = minOfDay(now);
  for (let o = 0; o < 8 && out.length < 6; o++){
    const d = addDays(midnight(now), o), dow = isoDow(d);
    const list = S.lectures.filter(l => l.day === dow).map(l => T(l.time)).sort((a, b) => a - b);
    for (const m of list){ if (o === 0 && m <= nowMin) continue; out.push({key: ymd(d) + '|' + m, date: d, L: m}); }
  }
  return out;
}
function currentTarget(now){
  if (ui.custom) return ui.custom;
  const ups = upcoming(now);
  return ups.find(u => u.key === ui.targetKey) || ups[0] || null;
}

function detailsHTML(o, P, tgt){
  const stop = stopById(S.set.stopId), f = frac(S.set.stopId), b = band(o.dep);
  const ratio = ratioMed(P.M, b);
  const ride = FULL_RIDE[b] * DAYF[P.dt] * f * ratio;
  const off = o.pass + 0.5 + ride, tr = S.set.transfer * ratio;
  const h = headwayAt(P.dt, off + tr) || 10;
  const uni = off + tr + h / 2 + 2.5;
  let chips = '';
  if (P.opts.length > 1){
    const lo = Math.max(0, P.rec - 1), hi = Math.min(P.opts.length, lo + 4);
    for (let i = lo; i < hi; i++){ const x = P.opts[i]; chips += `<button class="chip" data-act="opt" data-k="${x.k}" aria-pressed="${x === o}"><b>${hm(x.leave)}</b><span class="${probClass(x.p)}">${pct(x.p)}</span></button>`; }
  }
  const trips = S.trips, done = trips.filter(x => x.t && x.t.board && x.t.arrive);
  const withL = trips.filter(x => x.t && x.t.arrive && x.L != null), onTime = withL.filter(x => (x.t.arrive - x.base) / 60000 <= x.L).length;
  const dl = P.M.obs.delay;
  let you;
  if (!trips.length) you = `<p class="muted">${esc(t('dNoTrips'))}</p>`;
  else {
    const avg = done.length ? Math.round(mean(done.map(x => (x.t.arrive - x.t.board) / 60000)) + S.set.walkToStop + 1.5) : '--';
    you = `<p>${esc(t('dStats', {n: trips.length, a: avg, p: withL.length ? Math.round(onTime / withL.length * 100) : '--'}))}</p>`;
    if (dl.length){ const m = mean(dl); you += `<p>${esc(t('dDelay', {v: dec(Math.abs(m)), w: m < 0 ? t('early') : t('lateW')}))}</p>`; }
  }
  const url = 'https://www.google.com/maps/dir/?api=1&origin=' + stop.la + ',' + stop.lo + '&destination=' + encodeURIComponent('Ege Üniversitesi Makine Mühendisliği Bölümü, Bornova') + '&travelmode=transit';
  return `<div class="details">
    <h3>${esc(t('dJourney'))}</h3>
    <ol class="steps">
      <li><time>${hm(o.leave)}</time><span>${esc(t('dLeave'))}</span></li>
      <li><time>${hm(o.pass)}</time><span>${esc(t('dBus', {stop: stop.n}))}</span></li>
      <li><time>${hm(off)}</time><span>${esc(t('dOff'))}</span></li>
      <li><time>${hm(off + tr + h / 2)}</time><span>${esc(t('dMetro', {h: dec(h)}))}</span></li>
      <li><time>${hm(uni)}</time><span>${esc(t('dWalk', {n: S.set.walkFromMetro}))}</span></li>
      <li><time>${hm(o.q50)}</time><span>${esc(t('dDept'))}</span></li>
    </ol>
    ${chips ? `<h3>${esc(t('dOther'))}</h3><div class="chips">${chips}</div>` : ''}
    <h3>${esc(t('dYou'))}</h3>${you}
    <p><a class="link" href="${url}" target="_blank" rel="noopener noreferrer">${esc(t('dMaps'))}</a></p>
    <p class="small muted">${esc(t('dStop', {id: stop.id}))}</p>
  </div>`;
}

function homeView(now){
  if (!S.onboarded || !S.lectures.length && !ui.custom) return setupView();
  if (ui.picking) return pickerView(now);
  if (S.active) return tripView(now);
  const tgt = currentTarget(now);
  if (!tgt) return setupView();
  const nowMin = minOfDay(now), isToday = sameDay(tgt.date, now);
  const P = planFor(S, dayTypeOf(tgt.date), tgt.L, isToday ? nowMin : null);
  if (isToday) applyLive(P, nowMin);
  const targetBtn = `<button class="target" data-act="pick">${esc(t('forLecture', {d: dayLabel(tgt.date, now), t: hm(tgt.L)}))} <span>${esc(t('change'))}</span></button>`;
  if (!P.opts.length){ lastPlan = {P, tgt, isToday, o: null}; return targetBtn + `<p class="note" style="text-align:left">${esc(t('noBus'))}</p>`; }
  let sel = P.rec;
  if (ui.optK != null){ const i = P.opts.findIndex(x => x.k === ui.optK); if (i >= 0) sel = i; }
  const o = P.opts[sel];
  lastPlan = {P, tgt, isToday, o};
  let cls, txt;
  if (!isToday){ cls = 'future'; txt = dayLabel(tgt.date, now); }
  else {
    const m = o.leave - nowMin;
    if (m > 10){ cls = 'calm'; txt = m >= 60 ? t('inHM', {h: Math.floor(m / 60), m: Math.round(m % 60)}) : t('inM', {m: Math.round(m)}); }
    else if (m > 2){ cls = 'soon'; txt = t('inM', {m: Math.round(m)}); }

  const live = isToday ? liveText() : null, stop = stopById(S.set.stopId);
  return `${targetBtn}

    <section class="hero"><p class="label">${esc(t('leave'))}</p><p class="time">${hm(o.leave)}</p><p class="count ${cls}">${esc(txt)}</p></section>
    <div class="facts">
      <div class="fact"><span class="led">568</span><div class="k"><b>${esc(t('busAt', {t: hm(o.pass)}))}</b><span>${esc(stop.n)}${live ? ` · <span class="live${live.on ? '' : ' off'}"><i></i>${esc(live.txt)}</span>` : ''}</span></div></div>
      <div class="fact"><span class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-6h6v6"/></svg></span><div class="k"><b>${esc(t('arrive', {t: hm(o.q50)}))}</b><span>${esc(t('onTime'))}</span></div><span class="v ${probClass(o.p)}">${pct(o.p)}</span></div>
    </div>
    ${isToday ? `<button class="primary" data-act="board">${esc(t('board'))}</button>` : `<p class="note">${esc(t('futureNote', {d: dayLabel(tgt.date, now)}))}</p>`}
    <button class="quiet" data-act="details" aria-expanded="${ui.details}">${esc(ui.details ? t('hide') : t('details'))}</button>
    ${ui.details ? detailsHTML(o, P, tgt) : ''}`;

function render(){
  const now = new Date(), Lx = L();
  document.documentElement.lang = S.set.lang;
  $('dateline').innerHTML = `<b>${esc(S.set.name ? t('hi') + ', ' + S.set.name : Lx.days[now.getDay()])}</b> · ${now.getDate()} ${esc(Lx.months[now.getMonth()])}`;

function go(view){ ui.view = view; ui.picking = false; render(); window.scrollTo(0, 0); maybeLive(true); }

/* ---------- Actions ---------- */
function addLecture(){
  const time = $('l-time').value; if (!time) return;
  if (!ui.lecDays.length){ toast(t('pickDay')); return; }
  for (const d of ui.lecDays) if (!S.lectures.some(l => l.day === d && l.time === time)) S.lectures.push({id: uid(), day: d, time});
  ui.lecDays = []; ui.lecTime = time; save(); render();
}
function board(){
  const now = new Date(), tgt = lastPlan ? lastPlan.tgt : currentTarget(now), base = midnight(now).getTime(), dt = dayTypeOf(now), stopId = S.set.stopId;
  const inf = inferBus(dt, stopId, minOfDay(now));
  S.active = {id: uid(), base, dt, stopId, L: tgt ? tgt.L : minOfDay(now) + 60, buffer: S.set.buffer, dep: inf ? inf.dep : null, delay: inf ? inf.delay : null, t: {board: Date.now()}};
  save(); render(); toast(t('boarded'));
}
function arrive(){
  const a = S.active; if (!a) return;
  a.t.arrive = Date.now();
  S.trips.push({id: a.id, base: a.base, dt: a.dt, stopId: a.stopId, L: a.L, buffer: a.buffer, dep: a.dep, delay: a.delay, t: a.t});
  if (S.trips.length > 300) S.trips = S.trips.slice(-300);
  S.active = null; ui.optK = null; save();
  const diff = Math.round(a.L - (a.t.arrive - a.base) / 60000);
  toast(diff >= 0 ? t('savedOk', {n: diff}) : t('savedLate', {n: -diff}));
  render();
}
function expireStale(){
  const a = S.active; if (!a) return;
  if (Date.now() - a.t.board > 3 * 3600 * 1000){
    S.trips.push({id: a.id, base: a.base, dt: a.dt, stopId: a.stopId, L: a.L, buffer: a.buffer, dep: a.dep, delay: a.delay, t: a.t});
    S.active = null; save();
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.getAttribute('data-act');
  switch (act){
    case 'settings': go('settings'); break;
    case 'home': go('home'); break;
    case 'start': if (S.lectures.length){ S.onboarded = true; save(); render(); maybeLive(true); } break;
    case 'lecDay': { const d = +b.getAttribute('data-d'); ui.lecTime = $('l-time').value || ui.lecTime; ui.lecDays = ui.lecDays.includes(d) ? ui.lecDays.filter(x => x !== d) : ui.lecDays.concat(d); render(); break; }
    case 'lecAdd': addLecture(); break;
    case 'lecDel': S.lectures = S.lectures.filter(l => l.id !== b.getAttribute('data-id')); save(); render(); break;
    case 'pick': ui.picking = true; render(); window.scrollTo(0, 0); break;
    case 'closePick': ui.picking = false; render(); break;
    case 'target': ui.custom = null; ui.targetKey = b.getAttribute('data-key'); ui.picking = false; ui.optK = null; render(); maybeLive(true); break;
    case 'cday': ui.customDay = +b.getAttribute('data-v'); { const v = $('c-time').value; render(); if (v) $('c-time').value = v; } break;
    case 'applyCustom': {
      const v = $('c-time').value; if (!v) return;
      const m = T(v);
      ui.custom = {key: 'custom', date: addDays(midnight(new Date()), ui.customDay), L: m >= 1440 ? m - 1440 : m};
      ui.picking = false; ui.optK = null; render(); maybeLive(true); break;
    }
    case 'opt': ui.optK = +b.getAttribute('data-k'); render(); break;
    case 'details': ui.details = !ui.details; render(); break;
    case 'board': board(); break;
    case 'arrived': arrive(); break;
    case 'cancelTrip': S.active = null; save(); render(); break;
    case 'lang': S.set.lang = b.getAttribute('data-v'); save(); render(); break;
    case 'backup': {
      let code = ''; try { code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (err) {}
      $('s-restore').value = code; copyText(code); break;
    }
    case 'restore': {
      try {
        const obj = JSON.parse(decodeURIComponent(escape(atob(($('s-restore').value || '').trim()))));
        if (!obj || typeof obj !== 'object' || !obj.set) throw new Error('bad');
        S = normalize(obj); S.onboarded = true; save(); toast(t('restored')); render();
      } catch (err) { toast(t('restoreBad')); }
      break;
    }
    case 'reset':
      if (ui.resetArm > Date.now()){ S = DEFAULTS(); ui.resetArm = 0; try { localStorage.removeItem(KEY); } catch (err) {} IDB.clear(); toast(t('resetDone')); go('home'); }
      else { ui.resetArm = Date.now() + 4000; render(); setTimeout(() => { if (ui.view === 'settings' && !isTyping()) render(); }, 4100); }
      break;
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-set]'); if (!el) return;
  const key = el.getAttribute('data-set');
  let v = el.value;
  if (key === 'stopId'){ v = +v; LIVE.status = 'idle'; LIVE.buses = []; }
  else if (key === 'name') v = String(v).trim().slice(0, 30);
  else v = Math.max(0, Math.min(60, Math.round(+v || 0)));
  S.set[key] = v; save();
  if (key === 'name') render();
});

/* ---------- Clock and live polling ---------- */
let lastMinute = -1, lastLive = 0;
function maybeLive(force){ if (!liveWanted()) return; if (force || Date.now() - lastLive > 25000){ lastLive = Date.now(); fetchLive(); } }
function tick(){
  expireStale();
  const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
  if (m !== lastMinute && !isTyping() && ui.view === 'home'){ lastMinute = m; render(); }
  maybeLive();
}
render();
lastMinute = new Date().getHours() * 60 + new Date().getMinutes();
maybeLive(true);
setInterval(tick, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ lastMinute = -1; tick(); maybeLive(true); } });

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
</body>
</html>
