/* Layout: a departure board in your pocket. A dark board band at the top (under the iOS status bar),
   then one column: big leave time, an ESHOT-style LED destination sign, the door-to-desk timeline,
   other buses. Fixed bottom tab bar like a native app. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#111820; --muted:#5A6573; --line:#D5DBE2;
  --accent:#0F6A8A; --accent-ink:#FFFFFF; --accent-soft:#DCEDF3;
  --ok:#1B8455; --ok-soft:#DDF1E6; --warn:#AE5E15; --warn-soft:#F8E8D5; --bad:#C23434; --bad-soft:#F8DEDE;
  --bus:#C98200; --metro:#C8102E;
  --board:#14120D; --board-ink:#F3EEE2; --board-muted:#A79F8C;
  --sign:#0E0C08; --sign-edge:#2B2619; --led:#FFB01F; --led-dim:rgba(255,176,31,.22);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Overpass","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-led:"DotGothic16",ui-monospace,"Courier New",monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --surface:#151C23; --surface-2:#1A222A; --ink:#E6EBF0; --muted:#94A1AF; --line:#26303A;
    --accent:#4DB1D2; --accent-ink:#062530; --accent-soft:#11303B;
    --ok:#4CC387; --ok-soft:#113425; --warn:#E59D55; --warn-soft:#3A2815; --bad:#F06C6C; --bad-soft:#3D1C1C;
    --bus:#F0B13C; --metro:#F2617A;
    --board:#0A0906; --board-ink:#F3EEE2; --board-muted:#A79F8C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1A222A; --ink:#E6EBF0; --muted:#94A1AF; --line:#26303A;
  --accent:#4DB1D2; --accent-ink:#062530; --accent-soft:#11303B;
  --ok:#4CC387; --ok-soft:#113425; --warn:#E59D55; --warn-soft:#3A2815; --bad:#F06C6C; --bad-soft:#3D1C1C;
  --bus:#F0B13C; --metro:#F2617A;
  --board:#0A0906; --board-ink:#F3EEE2; --board-muted:#A79F8C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* Board header */
.board{background:var(--board);color:var(--board-ink);padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:16px}
.board-in{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.board h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.05;letter-spacing:.005em;text-wrap:balance}
.board p{margin:3px 0 0;color:var(--board-muted);font-size:14px}
.brand{display:flex;align-items:center;gap:6px;flex-shrink:0;font-family:var(--f-led);font-size:14px;letter-spacing:.06em;color:var(--led);text-shadow:0 0 6px rgba(255,176,31,.5);padding-top:6px}

.app{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.tab{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.1;text-wrap:balance}

/* Targets */
.targets{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.targets::-webkit-scrollbar{display:none}
.tchip{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.tchip b{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.1}
.tchip span{font-size:12px;color:var(--muted);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tchip[aria-pressed="true"] span{color:inherit;opacity:.75}
.tchip.ghost{border-style:dashed;background:transparent;justify-content:center}

/* Hero */
.hero{display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.leave-label{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.leave-time{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(76px,25vw,108px);line-height:.86;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.pill.calm{background:var(--ok-soft);color:var(--ok)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.now,.pill.run{background:var(--bad);color:#fff}
.pill.future{background:var(--accent-soft);color:var(--accent)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.now .dot,.pill.run .dot{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.fuse{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.fuse i{display:block;height:100%;background:var(--ok);transition:width .6s ease}
.fuse.soon i{background:var(--warn)} .fuse.now i,.fuse.run i{background:var(--bad)}

/* LED sign */
.sign{position:relative;display:flex;align-items:center;gap:12px;background:var(--sign);border:1px solid var(--sign-edge);border-radius:10px;padding:12px 14px;color:var(--led);font-family:var(--f-led);text-shadow:0 0 6px rgba(255,176,31,.55);overflow:hidden}
.sign::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.42) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.42) 0 1px,transparent 1px 3px)}
.sign-num{font-size:40px;line-height:1;padding:4px 8px 2px;border:1px solid var(--led-dim);border-radius:4px;flex-shrink:0}
.sign-dest{display:flex;flex-direction:column;min-width:0;gap:4px}
.sign-dest b{font-weight:400;font-size:22px;letter-spacing:.05em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign-dest small{font-size:13px;letter-spacing:.04em;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Live line */
.live{margin:0;display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.35}
.live .ld{flex-shrink:0;width:8px;height:8px;margin-top:4px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.live .ld.off{background:var(--muted);box-shadow:0 0 0 3px var(--surface-2)}
.live .ld.wait{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.live b{font-weight:600}
.live span.age{color:var(--muted)}

/* Arrival */
.arrival{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.arrival .big{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.prob{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.prob.ok{color:var(--ok)} .prob.warn{color:var(--warn)} .prob.bad{color:var(--bad)}
.arrival p{margin:0}

/* Timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.tl li{display:grid;grid-template-columns:52px 18px 1fr;gap:0 10px;align-items:start;padding:7px 0;position:relative}
.tl li::before{content:"";position:absolute;left:70px;top:0;bottom:0;width:2px;background:var(--line)}
.tl li:first-child::before{top:14px} .tl li:last-child::before{bottom:calc(100% - 14px)}
.tl time{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums;text-align:right}
.tl .mk{width:12px;height:12px;margin:5px 0 0 3px;border-radius:50%;background:var(--surface);border:2px solid var(--muted);position:relative;z-index:1}
.tl .mk.bus{background:var(--bus);border-color:var(--bus);border-radius:3px}
.tl .mk.metro{background:var(--metro);border-color:var(--metro);border-radius:3px}
.tl .mk.end{background:var(--ink);border-color:var(--ink)}
.tl .tx{min-width:0}
.tl .tx b{display:block;font-weight:600}
.tl .tx span{display:block;font-size:13px;color:var(--muted)}

/* Options */
.opts{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opt{flex:1 0 92px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.opt b{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.opt .p{font-weight:700;font-size:14px}
.opt .p.ok{color:var(--ok)} .opt .p.warn{color:var(--warn)} .opt .p.bad{color:var(--bad)}
.opt small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* Buttons */
.primary{width:100%;min-height:58px;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:8px 14px}
.primary small{font-weight:500;font-size:12px;opacity:.85}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.quiet{background:transparent}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.spread{justify-content:space-between}
a.link{color:var(--accent);font-weight:600;text-decoration:none}
a.link:hover{text-decoration:underline}
.checks{display:flex;flex-direction:column;gap:10px}
.code{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.04em}

/* Tracker */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px}
.steps li.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
.steps li.done{color:var(--muted)}
.steps li.done b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:1px}
.steps li.skip{color:var(--muted);text-decoration:line-through}
.steps b{font-weight:inherit}

/* Welcome */
.welcome{background:var(--surface);border:1px solid var(--line)}
.welcome p{margin:6px 0 0}
.welcome ol{margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:12px}
.welcome li::marker{font-weight:700;color:var(--accent)}

/* Forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f span.h{font-weight:400;font-size:12px;color:var(--muted)}
input[type=text],input[type=time],input[type=number],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:76px;resize:vertical;font-size:13px;font-family:ui-monospace,monospace}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{min-width:44px;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:13px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;border:0;background:var(--surface-2);font-weight:600;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Lecture list */
.dayblock{display:flex;flex-direction:column;gap:6px}
.dayblock h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.lec b{font-family:var(--f-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;flex-shrink:0}
.lec span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}

/* Stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);line-height:1.25}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.hist{width:100%;height:auto;display:block}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:left}

.privacy svg{flex-shrink:0;width:20px;height:20px;color:var(--ok);margin-top:1px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;width:max-content;max-width:min(420px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2)}

const STOPS = [

// Prior full-route ride time (terminal to Bornova Metro, minutes) by departure band; weekend factors.
const FULL_RIDE = {early:34, am:38, mid:36, pm:40, night:30};
const DAYF = {wd:1, sat:0.93, sun:0.88};
const BANDS = ['early','am','mid','pm','night'];
const N_SIM = 1600;

function band(m){ if (m < 420) return 'early'; if (m < 600) return 'am'; if (m < 960) return 'mid'; if (m < 1200) return 'pm'; return 'night'; }
function dayTypeOf(date){ const d = date.getDay(); return d === 0 ? 'sun' : d === 6 ? 'sat' : 'wd'; }
function stopById(id){ return STOPS.find(s => s.id === id) || STOPS[0]; }
function stopIndex(id){ const i = STOPS.findIndex(s => s.id === id); return i < 0 ? 0 : i; }
function frac(id){ return (ROUTE_LEN - stopById(id).d) / ROUTE_LEN; }
function passMed(dep, stopId, dt){ return dep + FULL_RIDE[band(dep)] * DAYF[dt] * stopById(stopId).d / ROUTE_LEN; }

function pick(a, r){ return a[Math.floor(r() * a.length)]; }
function wt(n, k){ return n / (n + k); }
function median(a){ if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function mean(a){ return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
function quant(sorted, q){ if (!sorted.length) return NaN; const i = Math.min(sorted.length - 1, Math.max(0, Math.round(q * (sorted.length - 1)))); return sorted[i]; }
function headwayAt(dt, m){ for (const [a, b, h] of METRO[dt]) if (m >= a && m < b) return h; return null; }
function busHeadwayAt(dt, m){ const d = TT[dt]; for (let i = 0; i < d.length - 1; i++) if (d[i + 1] > m) return d[i + 1] - d[i]; return null; }
function metroWait(dt, m, r){ if (m < 360) return (360 - m) + r() * 7.5; if (m >= 1460) return 600; const h = headwayAt(dt, m) || 10; return r() * h; }

function buildModel(state){
  const obs = {delay:[], walk:[], ride:{early:[], am:[], mid:[], pm:[], night:[]}, rest:[]};
  for (const t of state.trips){
    const x = t.t || {};
    if (t.delay != null && t.delay > -6 && t.delay < 30) obs.delay.push(t.delay);
    if (x.leave && x.atStop){ const w = (x.atStop - x.leave) / 60000; if (w > 0.3 && w < 40) obs.walk.push(w); }
    if (x.board && x.offBus && t.dep != null){
      const b = band(t.dep), ride = (x.offBus - x.board) / 60000;
      const full = ride / frac(t.stopId) / DAYF[t.dt || 'wd'];
      if (full > FULL_RIDE[b] * 0.35 && full < FULL_RIDE[b] * 3) obs.ride[b].push(full);
    }
    if (x.offBus && x.arrive){ const rest = (x.arrive - x.offBus) / 60000; if (rest > 4 && rest < 70) obs.rest.push(rest); }
  }
  const pooled = [];
  for (const b of BANDS) for (const v of obs.ride[b]) pooled.push(v / FULL_RIDE[b]);
  return {set: state.set, obs, pooled, n: state.trips.length};
}
function walkMed(M){ const o = M.obs.walk, s = M.set.walkToStop; if (!o.length) return s; const w = wt(o.length, 3); return w * median(o) + (1 - w) * s; }
function sampleWalk(M, r){ const o = M.obs.walk; if (o.length && r() < wt(o.length, 3)) return Math.max(0.3, pick(o, r) + nrm(r) * 0.25); return Math.max(0.5, M.set.walkToStop + nrm(r) * 0.4); }
function sampleDelay(M, r){ const o = M.obs.delay; if (o.length && r() < wt(o.length, 4)) return pick(o, r) + nrm(r) * 0.3; let d = 0.5 + nrm(r) * 0.9; if (r() < 0.1) d += expo(r, 4); return Math.max(-1.5, d); }
function sampleRideFull(M, b, dt, r){
  const o = M.obs.ride[b];
  if (o.length && r() < wt(o.length, 4)) return pick(o, r) * DAYF[dt] * Math.exp(nrm(r) * 0.04);
  if (!o.length && M.pooled.length && r() < wt(M.pooled.length, 8)) return pick(M.pooled, r) * FULL_RIDE[b] * DAYF[dt] * Math.exp(nrm(r) * 0.05);

  if (r() < 0.05) v += expo(r, 5);
  return v;
}
function rideMedFull(M, b, dt){
  const o = M.obs.ride[b], p = FULL_RIDE[b];
  if (o.length){ const w = wt(o.length, 4); return (w * median(o) + (1 - w) * p) * DAYF[dt]; }
  if (M.pooled.length){ const w = wt(M.pooled.length, 8); return (w * median(M.pooled) * p + (1 - w) * p) * DAYF[dt]; }

}
function sampleRest(M, off, dt, r){
  const o = M.obs.rest;
  if (o.length && r() < wt(o.length, 4)) return pick(o, r) + nrm(r) * 0.4;
  const tr = Math.max(1.5, M.set.transfer + nrm(r) * 0.8);
  return tr + metroWait(dt, off + tr, r) + 2.5 + nrm(r) * 0.25 + Math.max(3, M.set.walkFromMetro + nrm(r) * 1.0);

function seedOf(){ let h = 2166136261; for (const a of arguments){ const s = String(a); for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } } return h >>> 0; }

// Simulate leaving at `leave` aiming for bus index k0 (falls back to later buses when missed).
function simLeave(M, dt, stopId, leave, k0, seed, fixedStop){
  const deps = TT[dt], r = mulberry32(seed), out = new Float64Array(N_SIM), f = frac(stopId);
  let missed = 0;
  for (let i = 0; i < N_SIM; i++){
    const tStop = fixedStop != null ? fixedStop : leave + sampleWalk(M, r);
    let j = k0, board = -1;
    while (j < deps.length && j < k0 + 5){ const a = passMed(deps[j], stopId, dt) + sampleDelay(M, r); if (a >= tStop){ board = a; break; } j++; }
    if (board < 0){ out[i] = Infinity; continue; }
    if (j > k0) missed++;
    const off = board + sampleRideFull(M, band(deps[j]), dt, r) * f;
    out[i] = off + sampleRest(M, off, dt, r);
  }
  out.sort();

}
function simBoard(M, dt, stopId, dep, boardMin, seed){
  const r = mulberry32(seed), out = new Float64Array(N_SIM), f = frac(stopId), b = band(dep);
  for (let i = 0; i < N_SIM; i++){ const off = boardMin + sampleRideFull(M, b, dt, r) * f; out[i] = off + sampleRest(M, off, dt, r); }
  out.sort(); return {arr: out, missed: 0};
}
function simOff(M, dt, offMin, seed){
  const r = mulberry32(seed), out = new Float64Array(N_SIM);
  for (let i = 0; i < N_SIM; i++) out[i] = offMin + sampleRest(M, offMin, dt, r);
  out.sort(); return {arr: out, missed: 0};

function summarize(arr, deadline, lecture){
  let c = 0, c2 = 0; for (const v of arr){ if (v <= deadline) c++; if (v <= lecture) c2++; }

function pickRec(opts, conf){
  let rec = -1;
  for (let i = opts.length - 1; i >= 0; i--) if (opts[i].p >= conf){ rec = i; break; }
  if (rec < 0 && opts.length){ rec = 0; for (let i = 1; i < opts.length; i++) if (opts[i].p > opts[rec].p + 0.005) rec = i; }
  return rec;

// Plan: all buses that can bring her to the lecture; pick the latest one that meets the confidence target.
function planFor(state, dt, L, nowMin){
  const deps = TT[dt], M = buildModel(state), stopId = state.set.stopId, wm = walkMed(M);
  const margin = 1.5, deadline = L - state.set.buffer, opts = [];
  const mk = k => {
    const pass = passMed(deps[k], stopId, dt);
    const leave = Math.floor(pass - margin - wm);
    const sim = simLeave(M, dt, stopId, leave, k, seedOf(dt, k, stopId, deps[k], M.n, L));
    return Object.assign({k, dep: deps[k], pass, leave, missed: sim.missed}, summarize(sim.arr, deadline, L));
  };

    const pass = passMed(deps[k], stopId, dt);
    if (pass > L - 15 || pass < L - 150) continue;
    if (nowMin != null && Math.floor(pass - margin - wm) < nowMin - 2) continue;
    opts.push(mk(k));
  }
  let late = false;
  if (!opts.length && nowMin != null){
    for (let k = 0; k < deps.length && opts.length < 3; k++){
      const pass = passMed(deps[k], stopId, dt);
      if (Math.floor(pass - margin - wm) >= nowMin - 2 && pass < L + 120) opts.push(mk(k));
    }
    late = opts.length > 0;
  }
  return {dt, opts, rec: pickRec(opts, state.set.conf), deadline, L, M, wm, margin, late};
}
function inferBus(dt, stopId, boardMin){
  let best = null, bd = 1e9;
  for (const d of TT[dt]){ const diff = boardMin - passMed(d, stopId, dt); if (diff < -4 || diff > 25) continue; const sc = Math.abs(diff - 0.7); if (sc < bd){ bd = sc; best = d; } }
  return best == null ? null : {dep: best, delay: boardMin - passMed(best, stopId, dt)};
}
// Live: interpret the open-data "approaching buses" list for her stop.
function haversine(la1, lo1, la2, lo2){ const R = 6371000, r = Math.PI / 180, a = Math.sin((la2 - la1) * r / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin((lo2 - lo1) * r / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(a)); }

  const si = stopIndex(stopId), me = stopById(stopId), term = STOPS[0], out = [];
  const speed = ROUTE_LEN / (FULL_RIDE[band(nowMin)] * DAYF[dt]); // metres per minute
  for (const b of list || []){
    if (b == null) continue;
    if (b.HatNumarasi != null && +b.HatNumarasi !== 568) continue;
    const K = +b.KalanDurakSayisi;
    const la = parseFloat(String(b.KoorX).replace(',', '.')), lo = parseFloat(String(b.KoorY).replace(',', '.'));
    if (!isFinite(K) || K < 0) continue;
    if (isFinite(la) && isFinite(lo) && haversine(la, lo, me.la, me.lo) > 4500) continue; // stale or bad GPS fix
    const atTerminal = isFinite(la) && isFinite(lo) && haversine(la, lo, term.la, term.lo) < 180;
    let kind, eta = null;
    if (atTerminal || (si > 0 && K === si) || (si === 0 && K === 0)) kind = 'terminal';
    else if (K > si) kind = 'return';
    else { kind = 'coming'; eta = K === 0 ? 0 : Math.max(0.5, (me.d - STOPS[si - K].d) / speed + K * 0.2); }
    out.push({id: b.OtobusId, K, kind, eta});
  }
  out.sort((a, b) => (a.kind === 'coming' ? 0 : a.kind === 'terminal' ? 1 : 2) - (b.kind === 'coming' ? 0 : b.kind === 'terminal' ? 1 : 2) || (a.K - b.K));
  return out;
}

/* ---------- Storage: on this device only (localStorage, mirrored to IndexedDB) ---------- */
const KEY = 'derse-yetis-v1';
const DEFAULTS = () => ({v:1, onboarded:false, savedAt:0, set:{name:'', lang:'tr', stopId:31370, walkToStop:4, walkFromMetro:12, transfer:3, buffer:5, conf:0.9}, lectures:[], trips:[], active:null});
let storageOk = true, persisted = null;
function normalize(s){
  const d = DEFAULTS();
  if (!s || typeof s !== 'object') return d;
  return {v:1, onboarded:!!s.onboarded, savedAt:+s.savedAt || 0, set:Object.assign(d.set, s.set || {}), lectures:Array.isArray(s.lectures) ? s.lectures : [], trips:Array.isArray(s.trips) ? s.trips : [], active:s.active || null};
}
function loadLocal(){
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { storageOk = false; return null; }
}
const IDB = {
  p: null,
  open(){
    if (this.p) return this.p;
    this.p = new Promise(res => {
      try {
        const r = indexedDB.open('derse-yetis', 1);
        r.onupgradeneeded = () => { try { r.result.createObjectStore('kv'); } catch (e) {} };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return this.p;
  },
  async get(){
    const db = await this.open(); if (!db) return null;
    return new Promise(res => { try { const q = db.transaction('kv', 'readonly').objectStore('kv').get('state'); q.onsuccess = () => { try { res(q.result ? JSON.parse(q.result) : null); } catch (e) { res(null); } }; q.onerror = () => res(null); } catch (e) { res(null); } });
  },
  async set(str){
    const db = await this.open(); if (!db) return;
    try { db.transaction('kv', 'readwrite').objectStore('kv').put(str, 'state'); } catch (e) {}
  },
  async clear(){
    const db = await this.open(); if (!db) return;
    try { db.transaction('kv', 'readwrite').objectStore('kv').delete('state'); } catch (e) {}
  }
};
let S = normalize(loadLocal());
function save(){
  S.savedAt = Date.now();
  const str = JSON.stringify(S);
  try { localStorage.setItem(KEY, str); storageOk = true; } catch (e) { storageOk = false; }
  IDB.set(str);
  askPersist();
}
function askPersist(){
  if (persisted !== null) return;
  try {
    if (navigator.storage && navigator.storage.persist){
      persisted = false;
      navigator.storage.persisted().then(v => v || navigator.storage.persist()).then(v => { persisted = !!v; if (ui.tab === 'settings') renderSettings(); }).catch(() => {});
    }
  } catch (e) {}
}
// If localStorage was cleared but the IndexedDB copy survived (or is newer), restore it.
IDB.get().then(copy => {
  if (!copy) { if (S.savedAt) IDB.set(JSON.stringify(S)); return; }
  const c = normalize(copy);
  if ((c.savedAt || 0) > (S.savedAt || 0)){
    S = c;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    render();
  }
});
if (S.savedAt) askPersist();

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function L(){ return DICT[S.set.lang] || DICT.tr; }
function t(k, vars){ let s = L()[k]; if (s == null) s = DICT.tr[k] || k; if (vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]); return s; }
function pct(p){ const v = Math.round(p * 100); return S.set.lang === 'tr' ? '%' + v : v + '%'; }
function dec(v){ return String(v).replace('.', S.set.lang === 'tr' ? ',' : '.'); }
function hm(m){ m = Math.round(m); m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function minOfDay(d){ return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }
function midnight(d){ const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function sameDay(a, b){ return ymd(a) === ymd(b); }
function dayLabel(d, now){ if (sameDay(d, now)) return t('today'); if (sameDay(d, addDays(now, 1))) return t('tomorrow'); return L().days[d.getDay()]; }
function isoDow(d){ const x = d.getDay(); return x === 0 ? 7 : x; }
function uid(){ return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function probClass(p){ return p >= S.set.conf ? 'ok' : p >= 0.6 ? 'warn' : 'bad'; }
function durTxt(m){ m = Math.max(0, Math.round(m)); if (m >= 60) return t('inHM', {h: Math.floor(m / 60), m: m % 60}); return t('inM', {m}); }
function toast(msg){ const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(ui.toastT); ui.toastT = setTimeout(() => { el.hidden = true; }, 3800); }
function copyText(txt){
  try { navigator.clipboard.writeText(txt).then(() => toast(t('copied')), () => toast(t('copyFail'))); }
  catch (e) { toast(t('copyFail')); }
}

/* ---------- Live bus data (İzmir open data) ---------- */
const LIVE = {status:'idle', buses:[], at:0, fails:0, pauseUntil:0, busy:false, stopId:null};
const LIVE_URL = id => 'https://openapi.izmir.bel.tr/api/iztek/hattinyaklasanotobusleri/568/' + id;
async function fetchLive(){
  if (LIVE.busy || Date.now() < LIVE.pauseUntil || !navigator.onLine) return;
  LIVE.busy = true;
  const stopId = S.set.stopId, ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 7000);
  try {
    const res = await fetch(LIVE_URL(stopId), {signal: ctl.signal, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer'});
    if (!res.ok && res.status !== 204) throw new Error('http ' + res.status);
    const txt = res.status === 204 ? '' : await res.text();
    const data = txt ? JSON.parse(txt) : [];
    const list = Array.isArray(data) ? data : (data && Array.isArray(data.HatOtobusKonumlari) ? data.HatOtobusKonumlari : []);
    const now = new Date();
    LIVE.buses = parseLive(list, stopId, dayTypeOf(now), minOfDay(now));
    LIVE.at = Date.now(); LIVE.status = 'ok'; LIVE.fails = 0; LIVE.stopId = stopId;
  } catch (e) {
    LIVE.fails++;
    if (!(LIVE.at && Date.now() - LIVE.at < 90000)) LIVE.status = 'down';
    if (LIVE.fails >= 3) LIVE.pauseUntil = Date.now() + 5 * 60000;
  } finally {
    clearTimeout(to); LIVE.busy = false;
  }
  if (!isTyping() && (ui.tab === 'plan')) renderPlan();
}
function liveFresh(){ return LIVE.status === 'ok' && LIVE.stopId === S.set.stopId && Date.now() - LIVE.at < 150000; }
function liveWanted(){
  if (document.hidden) return false;
  const now = new Date(), nowMin = minOfDay(now);
  if (S.active) return !S.active.t.board;
  if (ui.tab !== 'plan') return false;
  if (!lastPlan || !lastPlan.isToday || !lastPlan.o) return false;
  return lastPlan.o.leave - nowMin < 75;
}
function liveAge(){ const s = Math.max(0, Math.round((Date.now() - LIVE.at) / 1000)); return s < 90 ? t('liveAge', {s}) : t('liveAgeMin', {m: Math.round(s / 60)}); }
function liveComing(){ if (!liveFresh()) return null; const elapsed = (Date.now() - LIVE.at) / 60000; const c = LIVE.buses.find(b => b.kind === 'coming'); return c ? Object.assign({}, c, {etaNow: Math.max(0, c.eta - elapsed)}) : null; }
function liveLineHTML(){
  if (LIVE.status === 'idle') return `<p class="live"><i class="ld off"></i><span class="muted">${esc(t('liveLoading'))}</span></p>`;
  if (!liveFresh()) return `<p class="live"><i class="ld off"></i><span class="muted">${esc(t('liveDown'))}</span></p>`;
  const c = liveComing();
  let msg, cls = '';
  if (c) msg = c.K === 0 ? t('liveAtStop') : t('liveComing', {k: c.K, m: Math.max(1, Math.round(c.etaNow))});
  else if (LIVE.buses.some(b => b.kind === 'terminal')){ msg = t('liveTerminal'); cls = 'wait'; }
  else if (LIVE.buses.some(b => b.kind === 'return')){ msg = t('liveReturn'); cls = 'wait'; }
  else { msg = t('liveNone'); cls = 'wait'; }
  return `<p class="live"><i class="ld ${cls}"></i><span><b>${esc(msg)}</b> <span class="age">· ${esc(liveAge())}</span></span></p>`;
}
// Snap a live, already departed bus onto the matching timetable option and recompute it.
function applyLive(P, nowMin){
  const c = liveComing(); if (!c || !P.opts.length) return;
  const livePass = nowMin + c.etaNow;
  let best = -1, bd = 1e9;
  P.opts.forEach((o, i) => { const diff = livePass - o.pass; if (diff >= -6 && diff <= 15 && Math.abs(diff - 1) < bd){ bd = Math.abs(diff - 1); best = i; } });
  if (best < 0) return;
  const o = P.opts[best];
  const sim = simBoard(P.M, P.dt, S.set.stopId, o.dep, livePass, seedOf('live', o.dep, Math.round(livePass * 2)));
  Object.assign(o, summarize(sim.arr, P.deadline, P.L), {pass: livePass, leave: Math.floor(livePass - P.margin - P.wm), live: true});
  P.opts = P.opts.filter(x => x.leave >= nowMin - 2);
  P.rec = pickRec(P.opts, S.set.conf);
}

/* ---------- Targets ---------- */
function upcoming(now){
  const out = [], nowMin = minOfDay(now);
  for (let o = 0; o < 8 && out.length < 6; o++){
    const d = addDays(midnight(now), o), dow = isoDow(d);
    const list = S.lectures.filter(l => l.day === dow).map(l => ({l, m: T(l.time)})).sort((a, b) => a.m - b.m);
    for (const x of list){ if (o === 0 && x.m <= nowMin) continue; out.push({key: ymd(d) + '|' + x.l.id, date: d, L: x.m, name: x.l.name || '', example: false}); }
  }
  return out;
}
function exampleTarget(now){
  let d = midnight(now); const nowMin = minOfDay(now);
  if (d.getDay() === 0 || d.getDay() === 6 || nowMin > 8 * 60){ do { d = addDays(d, 1); } while (d.getDay() === 0 || d.getDay() === 6); }
  return {key: 'example', date: d, L: 9 * 60 + 30, name: t('example'), example: true};
}
function currentTarget(now){
  if (ui.custom) return ui.custom;
  const ups = upcoming(now);
  if (!ups.length) return exampleTarget(now);
  return ups.find(u => u.key === ui.targetKey) || ups[0];
}

const STEPS = ['leave', 'atStop', 'board', 'offBus', 'arrive'];
const STEP_LABEL = {leave:'stLeave', atStop:'stAtStop', board:'stBoard', offBus:'stOff', arrive:'stArrive'};
function nextStep(a){
  let last = -1; STEPS.forEach((s, i) => { if (a.t[s] || (a.skipped || []).includes(s)) last = i; });
  return STEPS[last + 1] || null;
}
function tripPredict(a, now){
  const M = buildModel(S), dt = a.dt, base = a.base, toMin = ms => (ms - base) / 60000, nowMin = (now.getTime() - base) / 60000, x = a.t;
  let sim, waitInfo = null;
  if (x.offBus) sim = simOff(M, dt, toMin(x.offBus), seedOf('off', x.offBus));
  else if (x.board){ const dep = a.dep != null ? a.dep : (inferBus(dt, a.stopId, toMin(x.board)) || {dep: 480}).dep; sim = simBoard(M, dt, a.stopId, dep, toMin(x.board), seedOf('b', x.board)); }
  else {
    const reach = x.atStop ? toMin(x.atStop) : (x.leave ? toMin(x.leave) + walkMed(M) : nowMin + walkMed(M));
    const tStop = Math.max(reach, nowMin);
    const c = a.stopId === S.set.stopId ? liveComing() : null;
    if (c && nowMin + c.etaNow >= tStop - 0.5){
      const livePass = nowMin + c.etaNow;
      const inf = inferBus(dt, a.stopId, livePass) || {dep: 480};
      sim = simBoard(M, dt, a.stopId, inf.dep, livePass, seedOf('lw', a.id, Math.round(livePass * 2)));
      waitInfo = {pass: livePass, nowMin};
    } else {
      const deps = TT[dt]; let k0 = deps.findIndex(d => passMed(d, a.stopId, dt) >= tStop - 3);
      if (k0 < 0) k0 = deps.length - 1;
      sim = simLeave(M, dt, a.stopId, 0, k0, seedOf('w', a.id, k0, Math.floor(nowMin)), tStop);
      const nb = deps.findIndex(d => passMed(d, a.stopId, dt) >= nowMin - 2);
      if (nb >= 0) waitInfo = {pass: passMed(deps[nb], a.stopId, dt), nowMin};
    }
  }
  return {s: summarize(sim.arr, a.L - a.buffer, a.L), waitInfo};
}
function trackerHTML(now){
  const a = S.active, pr = tripPredict(a, now), ns = nextStep(a), s = pr.s;
  let steps = '';
  for (const st of STEPS){
    const done = a.t[st], skipped = (a.skipped || []).includes(st);
    const cls = done ? 'done' : skipped ? 'skip' : st === ns ? 'cur' : '';
    steps += `<li class="${cls}"><b>${esc(t(STEP_LABEL[st]))}</b><span class="num">${done ? hm(minOfDay(new Date(done))) : ''}</span></li>`;
  }
  const wait = pr.waitInfo ? `<p class="small" style="margin:0"><b>${esc(t('nextBus', {t: hm(pr.waitInfo.pass)}))}</b> <span class="muted">${esc(t('nextBusIn', {m: Math.max(0, Math.round(pr.waitInfo.pass - pr.waitInfo.nowMin))}))}</span></p>` : '';
  return `<div class="card hero">
    <p class="leave-label">${esc(t('onWay'))} · ${esc(t('etaFor', {t: hm(a.L)}))}</p>
    <div class="hero-top"><div><p class="leave-label" style="letter-spacing:.04em">${esc(t('eta'))}</p><p class="leave-time num">${s.q50 === Infinity ? '--:--' : hm(s.q50)}</p></div>
    <div class="prob ${probClass(s.p)}">${pct(s.p)}<div class="small muted" style="font-family:var(--f-body);font-weight:500">${esc(t('onTime'))}</div></div></div>
    ${!a.t.board ? liveLineHTML() : ''}
    ${wait}
    <ol class="steps">${steps}</ol>
    ${ns ? `<button class="primary" data-act="step">${esc(t(STEP_LABEL[ns]))}</button>` : ''}
    <div class="row spread">${ns && ns !== 'arrive' ? `<button class="btn quiet" data-act="skip">${esc(t('skip'))}</button>` : '<span></span>'}<button class="btn quiet danger" data-act="delTrip">${esc(ui.delArm > Date.now() ? t('delConfirm') : t('del'))}</button></div>
  </div>`;
}

/* ---------- Render: Stats ---------- */
function histSVG(vals){
  const lo = Math.floor(Math.min(...vals) / 2) * 2, hiV = Math.ceil(Math.max(...vals) / 2) * 2 + 2;
  const bins = []; for (let b = lo; b < hiV; b += 2) bins.push({b, n: 0});
  for (const v of vals){ const i = Math.min(bins.length - 1, Math.floor((v - lo) / 2)); bins[i].n++; }
  const W = 320, H = 120, padB = 22, maxN = Math.max(...bins.map(b => b.n)), bw = W / bins.length;
  let g = '';
  bins.forEach((b, i) => { const h = maxN ? (b.n / maxN) * (H - padB - 8) : 0; g += `<rect x="${(i * bw + 2).toFixed(1)}" y="${(H - padB - h).toFixed(1)}" width="${Math.max(2, bw - 4).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)"/>`; });
  const step = Math.max(1, Math.ceil(bins.length / 6));
  bins.forEach((b, i) => { if (i % step === 0) g += `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Overpass, sans-serif">${b.b}</text>`; });
  g += `<line x1="0" y1="${H - padB}" x2="${W}" y2="${H - padB}" stroke="var(--line)"/>`;
  return `<svg class="hist" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('sHist'))}">${g}</svg>`;
}
function renderStats(){

  }
  const rideCard = `<div class="card stack" style="gap:6px"><h2>${esc(t('sRide'))}</h2><p class="small muted" style="margin:0">${esc(t('sRideSub'))}</p>
    <div class="tbl-wrap"><table><thead><tr><th>${esc(t('thBand'))}</th><th class="n">${esc(t('thModel'))}</th><th class="n">${esc(t('thYou'))}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  const restModel = S.set.transfer + 2.5 + 2.5 + S.set.walkFromMetro;

    <p style="margin:4px 0 0;font-weight:600">${esc(t('sRestModel', {v: fmt1(restModel)}))}${ro.length ? ' · ' + esc(t('sRestYou', {v: fmt1(mean(ro)), n: ro.length})) : ''}</p></div>`;
  const histCard = totals.length >= 3
    ? `<div class="card stack" style="gap:8px"><h2>${esc(t('sHist'))}</h2>${histSVG(totals)}<p class="small muted" style="margin:0">${esc(t('min'))}</p></div>`
    : `<div class="empty"><b>${esc(t('sEmptyT'))}</b>${esc(t('sEmpty'))}</div>`;
  let recent = '';
  const last = trips.slice(-8).reverse();
  if (last.length){
    recent = `<div class="card stack" style="gap:6px"><h2>${esc(t('sRecent'))}</h2><div class="tbl-wrap"><table><tbody>${last.map(x => {
      const d = new Date(x.base);

      const ok = x.t.arrive && x.L != null ? ((x.t.arrive - x.base) / 60000 <= x.L ? '<span style="color:var(--ok)">&#10003;</span>' : '<span style="color:var(--bad)">&#215;</span>') : '';
      return `<tr><td>${esc(L().daysShort[d.getDay()])} ${d.getDate()} ${esc(L().months[d.getMonth()].slice(0, 3))}</td><td class="n">${x.dep != null ? hm(passMed(x.dep, x.stopId, x.dt)) : '--'}</td><td class="n">${esc(tot)}</td><td class="n">${ok}</td></tr>`;
    }).join('')}</tbody></table></div></div>`;
  }
  $('tab-stats').innerHTML = `<h2>${esc(t('stTitle'))}</h2>${tiles}${nowCard}${histCard}${busCard}${rideCard}${restCard}${recent}`;
}

      <div class="stack" style="gap:6px"><span class="small" style="font-weight:600">${esc(t('setConf'))}</span>
        <div class="seg" role="group"><button data-act="conf" data-v="0.95" aria-pressed="${c === 0.95}">${esc(t('confHi'))}</button><button data-act="conf" data-v="0.9" aria-pressed="${c === 0.9}">${esc(t('confMid'))}</button><button data-act="conf" data-v="0.75" aria-pressed="${c === 0.75}">${esc(t('confLo'))}</button></div></div>
      <div class="stack" style="gap:6px"><span class="small" style="font-weight:600">${esc(t('setLang'))}</span>
        <div class="seg" role="group"><button data-act="lang" data-v="tr" aria-pressed="${S.set.lang === 'tr'}">Türkçe</button><button data-act="lang" data-v="en" aria-pressed="${S.set.lang === 'en'}">English</button></div></div>
    </div>
    <div class="card stack" style="gap:10px">
      <div class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <div><h2 style="font-size:20px">${esc(t('privTitle'))}</h2><p class="small" style="margin:6px 0 0">${esc(t('privBody'))}</p><p class="small" style="margin:8px 0 0;font-weight:600">${store}</p></div></div>
    </div>
    <div class="card stack">
      <h2>${esc(t('setData'))}</h2>
      <p class="small muted" style="margin:0">${esc(t('setDataSub'))}</p>
      <button class="btn" data-act="backup">${esc(t('backup'))}</button>
      <label for="s-restore"><span class="vh">${esc(t('restorePh'))}</span><textarea id="s-restore" placeholder="${esc(t('restorePh'))}"></textarea></label>
      <div class="row spread"><button class="btn" data-act="restore">${esc(t('restore'))}</button><button class="btn danger" data-act="reset">${esc(ui.resetArm > Date.now() ? t('resetConfirm') : t('reset'))}</button></div>
    </div>
    <p class="foot">${esc(t('about'))}</p>`;
}

/* ---------- Shell ---------- */
function renderHeader(){
  const now = new Date(), h = now.getHours();
  const g = h >= 5 && h < 12 ? 'gMorning' : h >= 12 && h < 18 ? 'gDay' : h >= 18 && h < 22 ? 'gEve' : 'gNight';
  $('greet').textContent = t(g) + (S.set.name ? ', ' + S.set.name : '');
  const Lx = L();
  $('dateline').textContent = `${Lx.days[now.getDay()]}, ${now.getDate()} ${Lx.months[now.getMonth()]}`;
  document.documentElement.lang = S.set.lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.getAttribute('data-i')); });
}
function render(){
  renderHeader();
  for (const name of ['plan', 'lectures', 'stats', 'settings']){
    $('tab-' + name).hidden = ui.tab !== name;
    $('tb-' + name).setAttribute('aria-selected', String(ui.tab === name));
  }
  if (ui.tab === 'plan') renderPlan();
  else if (ui.tab === 'lectures') renderLectures();
  else if (ui.tab === 'stats') renderStats();
  else renderSettings();
}
function setTab(name){ ui.tab = name; render(); window.scrollTo(0, 0); maybeLive(); }
function isTyping(){ const a = document.activeElement; return !!(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)); }

/* ---------- Trip logging ---------- */
function startTrip(k){
  const now = new Date(), tgt = lastPlan ? lastPlan.tgt : currentTarget(now), base = midnight(now).getTime(), dt = dayTypeOf(now);
  S.active = {id: uid(), base, dt, stopId: S.set.stopId, L: tgt.L, buffer: S.set.buffer, plannedDep: k != null && TT[dt][k] != null ? TT[dt][k] : null, t: {leave: Date.now()}, skipped: [], startedAt: Date.now()};
  save(); render(); maybeLive(true);
}
function finishTrip(){
  const a = S.active; if (!a) return;
  const rec = {id: a.id, base: a.base, dt: a.dt, stopId: a.stopId, L: a.L, buffer: a.buffer, t: a.t, dep: a.dep != null ? a.dep : null, delay: a.delay != null ? a.delay : null};
  S.trips.push(rec); if (S.trips.length > 300) S.trips = S.trips.slice(-300);
  S.active = null; ui.optK = null; save();
  if (a.t.arrive){
    const arrMin = (a.t.arrive - a.base) / 60000, diff = Math.round(a.L - arrMin);
    toast(diff >= 0 ? t('saved', {t: hm(arrMin), n: diff}) : t('savedLate', {t: hm(arrMin), n: -diff}));
  } else toast(t('savedPlain'));
}
function step(){
  const a = S.active; if (!a) return;
  const ns = nextStep(a); if (!ns) return;
  a.t[ns] = Date.now();
  if (ns === 'board'){
    const inf = inferBus(a.dt, a.stopId, (a.t.board - a.base) / 60000);
    if (inf){ a.dep = inf.dep; a.delay = inf.delay; }
  }
  if (ns === 'arrive') finishTrip(); else save();
  render();
}
function expireStale(){
  const a = S.active; if (!a) return;
  if (Date.now() - a.startedAt > 4 * 3600 * 1000){
    if (a.t.board || a.t.atStop) finishTrip(); else { S.active = null; save(); }
  }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn){ setTab(tabBtn.getAttribute('data-tab')); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.getAttribute('data-act');
  switch (act){
    case 'target': ui.custom = null; ui.showCustom = false; ui.targetKey = b.getAttribute('data-key'); ui.optK = null; render(); maybeLive(); break;
    case 'toggleCustom': ui.showCustom = !ui.showCustom; if (!ui.showCustom) ui.custom = null; ui.optK = null; render(); break;
    case 'cday': ui.customDay = +b.getAttribute('data-v'); render(); break;
    case 'applyCustom': {
      const v = $('c-time').value; if (!v) return;
      const d = addDays(midnight(new Date()), ui.customDay || 0), m = T(v);
      ui.custom = {key: 'custom', date: d, L: m >= 1440 ? m - 1440 : m, name: '', example: false}; ui.optK = null; render(); maybeLive(); break;
    }
    case 'opt': ui.optK = +b.getAttribute('data-k'); render(); break;
    case 'startTrip': startTrip(+b.getAttribute('data-k')); break;
    case 'step': step(); break;
    case 'skip': { const a = S.active, ns = a && nextStep(a); if (ns && ns !== 'arrive'){ a.skipped = (a.skipped || []).concat(ns); save(); render(); } break; }
    case 'delTrip':
      if (ui.delArm > Date.now()){ S.active = null; ui.delArm = 0; save(); toast(t('deleted')); render(); }
      else { ui.delArm = Date.now() + 4000; render(); setTimeout(() => { if (ui.tab === 'plan') render(); }, 4100); }
      break;
    case 'copyStop': copyText(String(S.set.stopId)); break;
    case 'goLectures': setTab('lectures'); break;
    case 'onboarded': {
      const n = $('w-name'); if (n) S.set.name = n.value.trim().slice(0, 30);
      S.onboarded = true; save(); render(); break;
    }
    case 'lecDay': { const d = +b.getAttribute('data-d'); ui.lecTime = $('l-time').value; ui.lecName = $('l-name').value; ui.lecDays = ui.lecDays.includes(d) ? ui.lecDays.filter(x => x !== d) : ui.lecDays.concat(d); renderLectures(); break; }
    case 'lecAdd': {
      const time = $('l-time').value, name = $('l-name').value.trim();
      if (!time) return;
      if (!ui.lecDays.length){ toast(t('lecPickDay')); return; }
      for (const d of ui.lecDays) S.lectures.push({id: uid(), day: d, time, name});
      ui.lecDays = []; ui.lecName = ''; ui.lecTime = time; save(); toast(t('lecAdded')); renderLectures(); break;
    }
    case 'lecDel': S.lectures = S.lectures.filter(l => l.id !== b.getAttribute('data-id')); save(); renderLectures(); break;
    case 'conf': S.set.conf = +b.getAttribute('data-v'); save(); renderSettings(); break;
    case 'lang': S.set.lang = b.getAttribute('data-v'); save(); render(); break;
    case 'backup': {
      let code = '';
      try { code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (err) { code = ''; }
      const ta = $('s-restore'); if (ta) ta.value = code;
      copyText(code); break;
    }
    case 'restore': {
      const v = ($('s-restore').value || '').trim();
      try {
        const obj = JSON.parse(decodeURIComponent(escape(atob(v))));
        if (!obj || typeof obj !== 'object' || !obj.set) throw new Error('bad');
        S = normalize(obj); S.onboarded = true; save(); toast(t('restored')); render();
      } catch (err) { toast(t('restoreBad')); }
      break;
    }
    case 'reset':
      if (ui.resetArm > Date.now()){
        S = DEFAULTS(); ui.resetArm = 0;
        try { localStorage.removeItem(KEY); } catch (err) {}
        IDB.clear(); toast(t('resetDone')); render();
      } else { ui.resetArm = Date.now() + 4000; renderSettings(); setTimeout(() => { if (ui.tab === 'settings') renderSettings(); }, 4100); }
      break;
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-set]'); if (!el) return;
  const key = el.getAttribute('data-set');
  let v = el.value;
  if (key === 'stopId'){ v = +v; LIVE.status = 'idle'; LIVE.buses = []; }
  else if (key === 'name') v = String(v).trim().slice(0, 30);
  else v = Math.max(0, Math.min(60, Math.round(+v || 0)));
  S.set[key] = v; save();
  if (key === 'name') renderHeader();
  if (ui.tab === 'plan' && !isTyping()) renderPlan();
  if (key === 'stopId') maybeLive(true);
});

/* ---------- Clock and live polling ---------- */
let lastMinute = -1, lastLive = 0;
function maybeLive(force){
  if (!liveWanted()) return;
  if (force || Date.now() - lastLive > 25000){ lastLive = Date.now(); fetchLive(); }
}
function tick(){
  expireStale();
  const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
  if (m !== lastMinute && !isTyping()){ lastMinute = m; if (ui.tab === 'plan' || ui.tab === 'stats') render(); else renderHeader(); }
  maybeLive();
}
render();
lastMinute = new Date().getHours() * 60 + new Date().getMinutes();
maybeLive(true);
setInterval(tick, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ lastMinute = -1; tick(); maybeLive(true); } });

/* ---------- Offline support ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
