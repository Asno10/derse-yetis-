name: cors-check
on:
  push:
    branches: [cors-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the live bus API allows requests from the Pages site
        run: |
          URL="https://openapi.izmir.bel.tr/api/iztek/hattinyaklasanotobusleri/568/31364"
          curl -sS -m 25 -D headers.txt -o body.txt -H "Origin: https://asno10.github.io" "$URL" || echo "curl failed" > headers.txt
          H=$(grep -i -E "^HTTP|access-control" headers.txt | tr -d '\r' | tr '\n' ' ')
          B=$(head -c 120 body.txt | tr -d '\r\n')
          echo "::notice title=headers::${H:-none}"
          echo "::notice title=body::${B:-empty}"
